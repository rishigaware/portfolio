<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Rishi Gaware | Full-Stack Developer Portfolio</title>
    <meta name="description" content="Rishi Gaware is a full-stack developer building fast, accessible and animated web apps with React and Node.js. Explore projects, skills and get in touch." />
    <meta name="author" content="Rishi Gaware" />
    <!-- PRIVATE MODE: search engines are told not to index this site.
         At launch, change content to "index, follow, max-image-preview:large" (see README). -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Replace YOUR-DOMAIN.com with your real domain everywhere (see README) -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (link previews on LinkedIn, WhatsApp, Facebook, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rishi Gaware" />
    <meta property="og:title" content="Rishi Gaware | Full-Stack Developer Portfolio" />
    <meta property="og:description" content="Fast, accessible and animated web apps with React and Node.js. See my work and get in touch." />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rishi Gaware, full-stack developer portfolio" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rishi Gaware | Full-Stack Developer Portfolio" />
    <meta name="twitter:description" content="Fast, accessible and animated web apps with React and Node.js." />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />

    <!-- Structured data: tells search engines who this site is about -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://YOUR-DOMAIN.com/#person",
          "name": "Rishi Gaware",
          "jobTitle": "Full-Stack Developer",
          "url": "https://YOUR-DOMAIN.com/",
          "description": "Full-stack developer building fast, accessible and animated web applications with React and Node.js."
        },
        {
          "@type": "WebSite",
          "@id": "https://YOUR-DOMAIN.com/#website",
          "url": "https://YOUR-DOMAIN.com/",
          "name": "Rishi Gaware",
          "inLanguage": "en",
          "publisher": { "@id": "https://YOUR-DOMAIN.com/#person" }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Content for crawlers and visitors without JavaScript -->
    <noscript>
      <h1>Rishi Gaware – Full-Stack Developer</h1>
      <p>Rishi Gaware builds fast, accessible and animated web applications with React and Node.js.</p>
      <p>Please enable JavaScript to view the full interactive portfolio.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
