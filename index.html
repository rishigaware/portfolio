<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>RISHI</title>
    <meta
      name="description"
      content="Rushikesh Gaware is a Full Stack Developer with 3 years of experience building scalable full-stack web applications, enterprise workflow automation, and GenAI integrations."
    />
    <meta name="author" content="Rushikesh Gaware" />
    <!-- PRIVATE MODE: search engines are told not to index this site.
         At launch, change content to "index, follow, max-image-preview:large" (see README). -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Replace YOUR-DOMAIN.com with your real domain everywhere (see README) -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />
    <link rel="icon" type="image/png" href="/RG-logo.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/RG-logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (link previews on LinkedIn, WhatsApp, Facebook, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rishi Gaware" />
    <meta property="og:title" content="Rishi Gaware" />
    <meta
      property="og:description"
      content="Fast, accessible and animated web apps with React and Node.js. See my work and get in touch."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="/RG-logo.png" />
    <meta property="og:image:width" content="432" />
    <meta property="og:image:height" content="341" />
    <meta property="og:image:alt" content="Rishi Gaware Logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rishi Gaware" />
    <meta
      name="twitter:description"
      content="Fast, accessible and animated web apps with React and Node.js."
    />
    <meta name="twitter:image" content="/RG-logo.png" />

    <!-- Structured data: tells search engines who this site is about -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://YOUR-DOMAIN.com/#person",
            "name": "Rushikesh Gaware",
            "alternateName": "Rishi Gaware",
            "jobTitle": "Full Stack Developer",
            "url": "https://YOUR-DOMAIN.com/",
            "sameAs": ["https://github.com/RishiGaware"],
            "description": "Full Stack Developer with 3 years of experience building scalable full-stack web applications, enterprise workflow automation, and GenAI integrations."
          },
          {
            "@type": "WebSite",
            "@id": "https://YOUR-DOMAIN.com/#website",
            "url": "https://YOUR-DOMAIN.com/",
            "name": "Rushikesh Gaware",
            "inLanguage": "en",
            "publisher": { "@id": "https://YOUR-DOMAIN.com/#person" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
